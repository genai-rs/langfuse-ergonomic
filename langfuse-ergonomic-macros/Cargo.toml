[package]
name = "langfuse-ergonomic-macros"
version = "0.15.1"
edition = "2021"
authors = ["Tim Van Wassenhove <github@timvw.be>"]
license = "MIT OR Apache-2.0"
description = "The #[observe] attribute of langfuse-ergonomic (use it through langfuse-ergonomic)"
repository = "https://github.com/genai-rs/langfuse-ergonomic"
homepage = "https://github.com/genai-rs/langfuse-ergonomic"
documentation = "https://docs.rs/langfuse-ergonomic"
readme = "README.md"
keywords = ["langfuse", "observability", "llm", "tracing", "macro"]
categories = ["development-tools::debugging", "development-tools::procedural-macro-helpers"]
rust-version = "1.88"

[lib]
proc-macro = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "2.0.104", features = ["full", "visit"] }
