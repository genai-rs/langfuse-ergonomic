# Configuration for release-plz
# https://release-plz.dev/docs/config

[workspace]
# Enable changelog generation
changelog_update = true

# Enable git releases and tags
git_release_enable = true
git_tag_enable = true

# Git release body template - ensures GitHub releases have proper content
git_release_body = """
## What's Changed

{%- if changelog %}
{{ changelog }}
{%- else %}
_No changelog available_
{%- endif %}

**Full Changelog**: https://github.com/genai-rs/langfuse-ergonomic/blob/v{{ version }}/CHANGELOG.md
"""

# PR settings
pr_labels = ["release"]
pr_draft = false
# `version` is set when every released package has the same version (the version group below).
pr_name = "chore: release{% if version %} version {{ version }}{% endif %}"

# PR body template - ensures PR descriptions show the changelog
pr_body = """
{%- for release in releases -%}
##  {{ release.package }} {{ release.previous_version }}  {{ release.next_version }}

###  Compare Changes
[**View all changes since v{{ release.previous_version }}**](https://github.com/genai-rs/langfuse-ergonomic/compare/v{{ release.previous_version }}...HEAD)

{%- if release.changelog %}

###  Changelog

{{ release.changelog }}
{%- else %}

_No changelog available for this release_
{%- endif %}

{%- endfor %}

---
_This PR was generated by [release-plz](https://github.com/MarcoIeni/release-plz/)_
"""

# Publishing
publish = true
publish_allow_dirty = false

# The library and its `#[observe]` proc macro are released together with the same version: the
# macro's expansion calls the library's `__private` module, so the library pins the macros crate
# exactly (`=x.y.z`). Both are published.
[[package]]
name = "langfuse-ergonomic"
version_group = "langfuse-ergonomic"
changelog_path = "CHANGELOG.md"
# Keep the tag names of the single-crate releases.
git_tag_name = "v{{ version }}"

[[package]]
name = "langfuse-ergonomic-macros"
version_group = "langfuse-ergonomic"
changelog_update = false
git_release_enable = false
git_tag_name = "langfuse-ergonomic-macros-v{{ version }}"
