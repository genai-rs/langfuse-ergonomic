[package]
name = "langfuse-ergonomic"
version = "0.15.0"
edition = "2021"
authors = ["Tim Van Wassenhove <github@timvw.be>"]
license = "MIT OR Apache-2.0"
description = "Ergonomic Rust client for Langfuse with builder patterns"
repository = "https://github.com/genai-rs/langfuse-ergonomic"
homepage = "https://github.com/genai-rs/langfuse-ergonomic"
documentation = "https://docs.rs/langfuse-ergonomic"
readme = "README.md"
keywords = ["langfuse", "observability", "llm", "tracing", "monitoring"]
categories = ["api-bindings", "web-programming::http-client", "development-tools::debugging"]
rust-version = "1.88"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"


[workspace]
# The `#[observe]` proc macro lives in its own crate (proc macros must), released with this one.
members = [".", "langfuse-ergonomic-macros"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
langfuse-client-base = { version = "0.23", default-features = false }
# The HTTP stack of langfuse-client-base: a tower service, reqwest by default.
timvw-rust-runtime = { version = "^0.3.0", default-features = false, features = ["reqwest"] }
bon = "^3.10.3"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
reqwest = { version = "^0.13.5", features = ["json"], default-features = false }
thiserror = "^2.0.21"
chrono = { version = "^0.4.45", features = ["serde"] }
uuid = { version = ">=1.23.5, <1.27.0", features = ["v4", "v5", "serde"] }
# `sync` and `macros` (`select!`) work on any target; the runtime and the timers only natively (below).
tokio = { version = "^1.54.1", features = ["macros", "sync"] }
tracing = "^0.1.44"  # For library logging (replacing eprintln!)
rand = "^0.10.3"
# `#[observe]` (feature `macros`): the expansion calls `langfuse_ergonomic::__private`, so the versions are pinned.
langfuse-ergonomic-macros = { version = "=0.15.0", path = "langfuse-ergonomic-macros", optional = true }
# The observation context: futures and streams that carry it.
pin-project-lite = "0.2.16"
futures-core = "0.3.31"
# Experiments: bounded concurrency without a runtime (`buffer_unordered`).
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
# Media uploads: the SHA-256 Langfuse deduplicates and verifies uploads with.
sha2 = "0.10.9"
base64 = "0.22.1"
# Feature `otel-context`: nest OpenTelemetry spans (openai-ergonomic, opentelemetry-langfuse) under observations.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The batcher's background task (`tokio::spawn`) and its timers.
tokio = { version = "^1.54.1", features = ["rt-multi-thread", "time"] }

# WebAssembly in a JavaScript host (wasm32-unknown-unknown): the batcher's task runs with `spawn_local`, timers are the
# host's `setTimeout` and clocks `performance.now()`/`Date.now()` (std's panic there). See "WebAssembly" in README.md.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1"
# Random v4 ids from `crypto.getRandomValues`.
uuid = { version = ">=1.23.5, <1.27.0", features = ["js"] }
# The retry jitter (`rand`'s thread RNG) seeded from `crypto.getRandomValues`.
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tracing-subscriber = { version = "^0.3.23", features = ["env-filter"] }
dotenvy = "^0.15.7"
mockito = "^1.7.2"
anyhow = "^1.0.104"  # Used in examples
tower = { version = "^0.5.2", features = ["retry", "timeout"] }  # Used in middleware examples
trybuild = "1.0.105"
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "testing"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }

# `tests/wasm.rs`, run in Node.js with wasm-bindgen-test-runner (see "WebAssembly" in README.md).
[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"
http = "1"
tower = { version = "^0.5.2", default-features = false, features = ["util"] }

[[example]]
name = "test_trace"
path = "examples/test_trace.rs"

[[example]]
name = "basic_trace"
path = "examples/basic_trace.rs"

[[example]]
name = "trace_with_metadata"
path = "examples/trace_with_metadata.rs"

[[example]]
name = "multiple_traces"
path = "examples/multiple_traces.rs"

[[example]]
name = "observations"
path = "examples/observations.rs"

[[example]]
name = "scores"
path = "examples/scores.rs"

[[example]]
name = "datasets"
path = "examples/datasets.rs"

[[example]]
name = "traces_fetch"
path = "examples/traces_fetch.rs"

[[example]]
name = "prompts"
path = "examples/prompts.rs"

[[example]]
name = "batch_ingestion"
path = "examples/batch_ingestion.rs"

[[example]]
name = "batch_ingestion_207"
path = "examples/batch_ingestion_207.rs"

[[example]]
name = "self_hosted"  
path = "examples/self_hosted.rs"

[[example]]
name = "trace_urls_byo_ids"
path = "examples/trace_urls_byo_ids.rs"

[[example]]
name = "advanced_features"
path = "examples/advanced_features.rs"

[[example]]
name = "http_middleware_retry"
path = "examples/http_middleware_retry.rs"
required-features = ["retry"]

[[example]]
name = "comprehensive_batch_test"
path = "examples/comprehensive_batch_test.rs"


[features]
default = ["rustls", "macros"]
# The `#[observe]` attribute (re-exported as `langfuse_ergonomic::observe`).
macros = ["dep:langfuse-ergonomic-macros"]
# Attach an OpenTelemetry context for the current observation (Langfuse v4), and adopt the active
# OpenTelemetry span as the parent of root observations. See docs/observe.md.
otel-context = ["dep:opentelemetry"]
rustls = ["langfuse-client-base/rustls", "timvw-rust-runtime/rustls", "reqwest/rustls"]
native-tls = ["langfuse-client-base/native-tls", "timvw-rust-runtime/native-tls", "reqwest/native-tls"]
# timvw_rust_runtime::retry::RetryPolicy, for clients built with `http_client`.
retry = ["timvw-rust-runtime/retry", "langfuse-client-base/retry"]
# timvw_rust_runtime::trace::TraceLayer: logs each request with `tracing`.
tracing-http = ["timvw-rust-runtime/tracing", "langfuse-client-base/tracing"]
compression = ["reqwest/gzip", "reqwest/brotli", "reqwest/deflate"]
